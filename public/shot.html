<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}iframe{border:0;display:block}</style></head>
<body>
<iframe id="f" src="/" style="width:1440px;height:620px"></iframe>
<script>
setTimeout(function(){
  var w=document.getElementById('f').contentWindow;
  var d=w.document;
  d.querySelectorAll('.reveal').forEach(function(e){e.classList.add('in');});
  w.scrollTo(0, d.body.scrollHeight);
},2500);
</script>
</body></html>
